<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>贾唯 | Academic Homepage</title>
    <meta name="description" content="贾唯的个人学术主页：多模态推理、RLVR、信息抽取、事件推理与视频时序定位。" />
    <meta property="og:title" content="Wei Jia | Academic Homepage" />
    <meta property="og:description" content="Multimodal Reasoning · RLVR · Information Extraction · Video Grounding" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="profile-sidebar" aria-label="个人信息">
        <img class="profile-photo" src="assets/profile.jpeg" id="profile-photo" alt="贾唯的个人证件照" />
        <h1 data-field="name">贾唯</h1>
        <p class="name-secondary" data-field="englishName">Wei Jia</p>
        <p class="profile-role" data-field="role"></p>
        <p class="profile-affiliation" data-field="affiliation"></p>
        <ul class="profile-facts" id="profile-facts"></ul>
        <div class="profile-links" id="profile-links"></div>
        <div class="interest-list" id="interest-list"></div>
      </aside>

      <div class="main-column">
        <header class="site-header">
          <a class="mobile-name" href="#top" data-field="shortName">贾唯</a>
          <nav class="site-nav" aria-label="页面导航">
            <a href="#biography" data-label="navBiography">个人简介</a>
            <a href="#news" data-label="navNews">动态</a>
            <a href="#publications" data-label="navPublications">论文</a>
            <a href="#experience" data-label="navExperience">经历</a>
            <a href="#education" data-label="navEducation">教育</a>
            <a href="#honors" data-label="navHonors">荣誉</a>
          </nav>
          <button class="language-toggle" id="language-toggle" type="button" aria-label="切换语言">EN</button>
        </header>

        <main id="top">
          <section class="content-section intro-section" id="biography">
            <p class="section-overline" data-label="aboutLabel">ABOUT ME</p>
            <h2><span aria-hidden="true">👋</span> <span data-label="sectionBiography">个人简介</span></h2>
            <div class="biography" id="biography-copy"></div>
            <div class="opportunity-card" id="opportunity-card"></div>
          </section>

          <section class="content-section" id="news">
            <h2><span aria-hidden="true">🔥</span> <span data-label="sectionNews">近期动态</span></h2>
            <div class="news-list" id="news-list"></div>
          </section>

          <section class="content-section" id="publications">
            <h2><span aria-hidden="true">📝</span> <span data-label="sectionPublications">科研成果</span></h2>
            <div id="publication-groups"></div>
          </section>

          <section class="content-section" id="experience">
            <h2><span aria-hidden="true">💻</span> <span data-label="sectionExperience">实习与项目经历</span></h2>
            <div class="simple-list" id="experience-list"></div>
          </section>

          <section class="content-section" id="education">
            <h2><span aria-hidden="true">📖</span> <span data-label="sectionEducation">教育经历</span></h2>
            <div class="simple-list" id="education-list"></div>
          </section>

          <section class="content-section" id="honors">
            <h2><span aria-hidden="true">🎖</span> <span data-label="sectionHonors">荣誉奖项</span></h2>
            <div class="honor-list" id="honor-list"></div>
          </section>
        </main>

        <footer class="site-footer">
          <span data-field="footerName"></span>
          <span><span data-label="lastUpdated">最后更新</span> · 2026.08</span>
        </footer>
      </div>
    </div>

    <script src="site-data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
